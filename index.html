<style>
html,body{margin:0;padding:0;height:100%;background:#fff;color:#000;
-webkit-text-size-adjust:none;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;-webkit-user-select:none;-webkit-touch-callout:none}
/* Layout-Budget: Die Seite muss in eine Viewport-Hoehe von ~640px passen.
   Der Tolino-Browser zeigt durch seine Browserleiste weniger als 1024px.
   Alle Werte unten sind so gewaehlt, dass selbst der laengste Spruch
   (3 Zeilen) ohne Scrollen sichtbar bleibt. */
#seite{min-height:100%;-webkit-box-sizing:border-box;padding:18px 28px 14px;
display:-webkit-box;-webkit-box-orient:vertical;-webkit-box-pack:justify;
text-align:center;line-height:1.15}
.kopf{-webkit-box-flex:0}
.woche{font-size:40px;font-weight:normal;color:#555;letter-spacing:1px}
.datum{font-size:26px;color:#555;margin-top:2px}
.uhr{-webkit-box-flex:0;margin-top:6px}
.zeit{font-size:124px;font-weight:normal;letter-spacing:-2px;line-height:1}
.linie{height:1px;background:#bbb;margin:10px 40px 8px}
.wetter{-webkit-box-flex:0}
.wzeile{-webkit-box;display:-webkit-box;-webkit-box-orient:horizontal;
-webkit-box-pack:center;-webkit-box-align:center}
.wicon{width:72px;height:72px;-webkit-box-flex:0}
.wicon svg{width:72px;height:72px;display:block}
.wtemp{font-size:44px;-webkit-box-flex:0;margin-left:18px}
.wzeile2{font-size:24px;color:#555;margin-top:6px}
.wzeile3{font-size:21px;color:#666;margin-top:2px}
.wzeile4{font-size:21px;color:#666;margin-top:2px}
.spruch{-webkit-box-flex:0;margin:10px 24px 0;padding:10px 14px;border:1px solid #999}
/* Hoehenbegrenzung: max. 2 Zeilen. 4 der 100 Sprueche waeren sonst 3 Zeilen
   hoch und wuerden die Seite ueber den Bildschirm hinaus schieben.
   Darunter steht die Autorenzeile (21px) - dafuer sind oben ein paar
   Pixel (Abstaende) sparsamer gesetzt, damit alles in einer Hoehe bleibt. */
.stext{font-size:29px;line-height:1.2;height:70px;overflow:hidden}
.sautor{font-size:21px;color:#666;margin-top:6px}
.fuss{-webkit-box-flex:0;font-size:19px;color:#666;margin-top:10px}
.status{-webkit-box-flex:0;font-size:19px;color:#666;margin-top:4px;min-height:24px}
</style>
</head>

function lastSundayUTC(y,m){
  var d=new Date(Date.UTC(y,m+1,0));
  while(d.getUTCDay()!==0){d.setUTCDate(d.getUTCDate()-1);}
  return d;
}
function dstHours(now){
  var y=now.getUTCFullYear();
  var a=lastSundayUTC(y,2);a.setUTCHours(1);
  var b=lastSundayUTC(y,9);b.setUTCHours(1);
  var t=now.getTime();
  if(t>=a.getTime()&&t<b.getTime()){return 2;}
  return 1;
}
function berlin(){
  var n=new Date();
  var b=new Date(n.getTime()+dstHours(n)*3600000);
  var p={wd:b.getUTCDay(),y:b.getUTCFullYear(),mo:b.getUTCMonth(),d:b.getUTCDate(),
         h:b.getUTCHours(),mi:b.getUTCMinutes()};
  p.hh=(p.h<10?'0':'')+p.h;
  p.mm=(p.mi<10?'0':'')+p.mi;
  p.tz=dstHours(n)===2?'MESZ':'MEZ';
  return p;
}
function pad2(s){s=''+s;return s.length<2?'0'+s:s;}
function timeHHMM(iso){var i=iso.indexOf('T');return pad2(iso.substr(i+1,2))+':'+pad2(iso.substr(i+4,2));}

function wmo(code){
  if(code===0){return['klar','Klar'];}
  if(code===1){return['klar','Überwiegend klar'];}
  if(code===2){return['partly','Teilweise bewölkt'];}
  if(code===3){return['cloudy','Bewölkt'];}
  if(code===45||code===48){return['fog','Nebel'];}
  if(code>=51&&code<=57){return['rain','Nieselregen'];}
  if(code>=61&&code<=67){return['rain','Regen'];}
  if(code>=71&&code<=77){return['snow','Schneefall'];}
  if(code>=80&&code<=82){return['rain','Regenschauer'];}
  if(code===85||code===86){return['snow','Schneeschauer'];}
  if(code>=95){return['thunder','Gewitter'];}
  return['cloudy','Wetter'];
}
function wmoIcon(code){return wmo(code)[0];}
function wmoText(code){return wmo(code)[1];}

/* Fallback: deutsche Bedingungstexte -> Icon.
   Umlaute werden vorher transkribiert, sonst matcht z.B. 'bewölkt' nicht auf 'wolk'. */
function iconFromText(t){
  var s=(''+t).toLowerCase();
  s=s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  if(s.indexOf('gewitter')>=0||s.indexOf('thunder')>=0||s.indexOf('sturm')>=0
     ||s.indexOf('donner')>=0||s.indexOf('blitz')>=0||s.indexOf('orkan')>=0
     ||s.indexOf('tornado')>=0){return'thunder';}
  if(s.indexOf('schne')>=0||s.indexOf('snow')>=0||s.indexOf('eisregen')>=0){return'snow';}
  if(s.indexOf('regen')>=0||s.indexOf('rain')>=0||s.indexOf('schauer')>=0
     ||s.indexOf('drizzle')>=0||s.indexOf('niesel')>=0||s.indexOf('wolkenbruch')>=0
     ||s.indexOf('sleet')>=0){return'rain';}
  if(s.indexOf('nebel')>=0||s.indexOf('fog')>=0||s.indexOf('mist')>=0
     ||s.indexOf('dunst')>=0||s.indexOf('schleier')>=0){return'fog';}
  if(s.indexOf('teilweise')>=0||s.indexOf('wechselnd')>=0||s.indexOf('wechselhaft')>=0
     ||s.indexOf('vereinzelt')>=0){return'partly';}
  if(s.indexOf('wolk')>=0||s.indexOf('woelk')>=0||s.indexOf('cloud')>=0
     ||s.indexOf('bedeckt')>=0||s.indexOf('trueb')>=0||s.indexOf('trub')>=0
     ||s.indexOf('grau')>=0||s.indexOf('bewolkt')>=0){return'cloudy';}
  if(s.indexOf('klar')>=0||s.indexOf('sonnig')>=0||s.indexOf('sunny')>=0
     ||s.indexOf('heiter')>=0){return'klar';}
  return'partly';
}

/* Millisekunden bis zur naechsten vollen Minute (minuetlicher Refresh).
   ACHTUNG: Sekunden der laufenden Minute, NICHT Minuten der laufenden Stunde. */
function msToNextMinute(){
  var n=new Date();
  return (60-n.getUTCSeconds())*1000-n.getUTCMilliseconds()+250;
}

function render(){
  var p=berlin();
  document.getElementById('woche').innerHTML=WD[p.wd];
  document.getElementById('datum').innerHTML=p.d+' '+MO[p.mo]+' '+p.y;
  document.getElementById('zeit').innerHTML=p.hh+':'+p.mm;

  var doy=Math.floor((Date.UTC(p.y,p.mo,p.d)-Date.UTC(p.y,0,1))/86400000);
  var item=SPRUECHE[((doy%SPRUECHE.length)+SPRUECHE.length)%SPRUECHE.length];
  document.getElementById('stext').innerHTML='„'+item.text+'“';
  document.getElementById('sautor').innerHTML=item.author?('– '+item.author):'';

  setTimeout(function(){render();},msToNextMinute());
}

function setStatus(txt){document.getElementById('status').innerHTML=txt;}

/* Leerer Sichtbarkeitsschalter: verhindert, dass eine leere Zeile (z.B. bei
   wttr-Fallback, wo es keine Hoch/Tief-Werte gibt) trotzdem Hoehe belegt. */
function hide(id){var e=document.getElementById(id);e.innerHTML='';e.style.display='none';}
function show(id,txt){var e=document.getElementById(id);e.style.display='';e.innerHTML=txt;}
function hasNum(v){return v!==''&&v!==null&&v!==undefined&&!isNaN(v);}

function showWeather(w,live,label){
  document.getElementById('wicon').innerHTML=ICONS[w.icon]||ICONS.cloudy;
  document.getElementById('wtemp').innerHTML=w.temp+'°';
  document.getElementById('wtext').innerHTML=w.text;
  var d='';
  if(hasNum(w.wind)){d+='Wind '+w.wind+' km/h';}
  if(hasNum(w.feels)){d+=(d?' · ':'')+'Gefühlt '+w.feels+'°';}
  if(d){show('wdetail',d);}else{hide('wdetail');}
  /* Tages-Hoechst- und Tiefstwert (nur Open-Meteo liefert diese) */
  if(hasNum(w.hi)&&hasNum(w.lo)){
    show('whl','Hoch '+w.hi+'° · Tief '+w.lo+'°');
  }else{
    hide('whl');
  }
  /* Sonnenauf- und -untergang in Berlin-Zeit (nur Open-Meteo) */
  if(w.sunrise&&w.sunset){show('wsun','Sonne '+w.sunrise+' – '+w.sunset);}
  else{hide('wsun');}
  var tag=label?label:(live?'live':'nicht aktuell');
  document.getElementById('status').innerHTML='Stand '+w.time+' · '+tag;
}

function parseOM(d){
  var c=d.current,dy=d.daily;
  var m=wmo(c.weather_code);
  var w={temp:Math.round(c.temperature_2m),feels:Math.round(c.apparent_temperature),
    wind:Math.round(c.wind_speed_10m),icon:m[0],text:m[1],
    hi:Math.round(dy.temperature_2m_max[0]),lo:Math.round(dy.temperature_2m_min[0]),
    sunrise:timeHHMM(dy.sunrise[0]),sunset:timeHHMM(dy.sunset[0]),
    time:c.time.substr(11,5)};
  return w;
}
function parseWTR(txt){
  txt=(''+txt);
  /* wttr.in erkennt den Browser am User-Agent und liefert die Ausgabe dann
     HTML-verpackt (~12 KB): <div class="term-container">DATEN</div>.
     Wir ziehen nur den Inhalt heraus, sonst wuerde der Parser aus den
     CSS-Farbwerten (#8a8a8a, #16...) wilde Zahlen extrahieren. */
  if(txt.indexOf('<')>=0){
    var m=txt.match(/term-container">([^<]*)</);
    txt=m?m[1]:txt.replace(/<[^>]*>/g,'');
  }
  /* HTML-Entities zurueck (wttr.in schreibt z.B. &#47; fuer '/') */
  txt=txt.replace(/&#(\d+);/g,function(_,n){return String.fromCharCode(n);})
         .replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
         .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
         .replace(/&quot;/g,'"').replace(/&nbsp;/g,' ');
  var a=txt.split('|');
  if(a.length<3){return null;}
  /* Temperatur: Minuszeichen erhalten (-4°C -> -4) */
  function num(s){s=(''+s).replace(/[^0-9-]/g,'');return s===''?'':parseInt(s,10);}
  /* Wind: nur Ziffern, damit Richtungspfeile (-> ab) und 'km/h' wegfallen */
  function windNum(s){s=(''+s).replace(/[^0-9]/g,'');return s===''?'':parseInt(s,10);}
  var t=num(a[0]),f=num(a[1]),c=(a[2]||'').replace(/^\s+|\s+$/g,'');
  if(t===''||c===''){return null;}
  var p=berlin();
  return{temp:t,feels:f,wind:windNum(a[3]),icon:iconFromText(c),text:c,
    hi:null,lo:null,sunrise:null,sunset:null,time:p.hh+':'+p.mm};
}

function xhr(url,cb,fail){
  var x=new XMLHttpRequest();
  var done=false;
  function to(){if(!done){done=true;fail();}}
  try{x.open('GET',url,true);}catch(e){to();return;}
  x.onreadystatechange=function(){
    if(x.readyState===4){
      if(done){return;}
      if(x.status===200&&x.responseText){done=true;cb(x.responseText);}
      else{to();}
    }
  };
  x.ontimeout=to;x.onerror=to;
  try{x.timeout=8000;x.send(null);}catch(e){to();}
}

function loadWeather(){
  xhr(OM_URL,function(txt){
    var d=null;
    try{d=JSON.parse(txt);}catch(e){}
    if(!d||!d.current){xhrWTR();return;}
    var w=parseOM(d);
    lsSet(JSON.stringify(w));
    showWeather(w,true);
  },xhrWTR);
}
/* wttr.in ist rate-limited. Wir markieren jeden Fallback-Versuch und
   versuchen es fruehestens nach TTL erneut. */
var WKEY='pinneberg_wtr_try';
function wtrBlocked(){
  var raw=lsGet2(WKEY),t=0;
  if(raw){t=parseInt(raw,10)||0;}
  return t>0&&(new Date().getTime()-t)<TTL;
}
function markWtrTry(){
  try{window.localStorage.setItem(WKEY,''+new Date().getTime());}catch(e){}
}

function xhrWTR(){
  if(wtrBlocked()){failWeather('Fallback gedrosselt (wttr.in-Limit)');return;}
  markWtrTry();
  xhr(WTR_URL,function(txt){
    var w=parseWTR(txt);
    if(!w){failWeather();return;}
    lsSet(JSON.stringify(w));
    showWeather(w,true);
  },failWeather);
}
function failWeather(note){
  var raw=lsGet(),w=null;
  if(raw){try{w=JSON.parse(raw);}catch(e){}}
  if(w){showWeather(w,false,note);}
  else{
    document.getElementById('wicon').innerHTML=ICONS.cloudy;
    document.getElementById('wtemp').innerHTML='--°';
    document.getElementById('wtext').innerHTML='Wetter nicht verfügbar';
    hide('wdetail');hide('whl');hide('wsun');
    setStatus('Kein Netz oder HTTP blockiert (kein HTTPS auf dem Gerät)');
  }
}
function boot(){
  render();
  var raw=lsGet(),w=null;
  if(raw){try{w=JSON.parse(raw);}catch(e){}}
  /* Zwischengespeicherte Werte sofort anzeigen, Netz laeuft im Hintergrund */
  if(w){showWeather(w,false,'zwischengespeichert');}
  loadWeather();
}
/* Ein Tap loest zuerst touchstart und danach einen synthetischen click aus.
   Ohne Schalter wuerde zweimal neu geladen -> doppelte API-Abfragen. */
var reloading=false;
function tapReload(){
  if(reloading){return;}
  reloading=true;
  document.location.reload();
}
document.addEventListener('touchstart',tapReload,false);
document.addEventListener('click',tapReload,false);
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot,false);
}else{boot();}
</script>
